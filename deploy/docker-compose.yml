version: '3.8'
services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flinksight
    ports: ['3306:3306']
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports: ['2181:2181']
  kafka:
    image: wurstmeister/kafka:2.12-2.2.1
    ports: ['9092:9092']
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on: [zookeeper]
  backend:
    build: ../flinksight-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flinksight
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
    ports: ['8080:8080']
    depends_on: [mysql, kafka]
  flinkjob:
      image: ../flinksight-flink-job:latest
      depends_on:
        - mysql
