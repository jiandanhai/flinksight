# 顶层菜单（真源）
tops:
  - code: dashboard
    titleZh: 总览大屏
    titleEn: Dashboard
    path: /dashboard
    icon: HomeOutlined
    order: 10
    perm: DASHBOARD_VIEW
    children: []

  - code: cluster
    titleZh: 集群管理
    titleEn: Clusters
    path: /cluster
    icon: DatabaseOutlined
    order: 30
    perm: CLUSTER_VIEW
    children:
      - code: cluster.list
        titleZh: 集群列表
        titleEn: Cluster List
        path: /cluster/list
        order: 10
        perm: CLUSTER_VIEW

  - code: job
    titleZh: 作业运维
    titleEn: Jobs
    path: /job
    icon: DatabaseOutlined
    order: 35
    perm: JOB_VIEW
    children:
      - code: job.list
        titleZh: 作业列表
        titleEn: Job List
        path: /job/list
        order: 10
        perm: JOB_VIEW

  - code: alerts
    titleZh: 报警中心
    titleEn: Alerts
    path: /alerts
    icon: BellOutlined
    order: 40
    perm: ALERT_VIEW
    children:
      - code: alerts.list
        titleZh: 报警管理
        titleEn: Alerts List
        path: /alerts/list
        order: 10
        perm: ALERT_VIEW
      - code: alerts.notification
        titleZh: 通知中心
        titleEn: Notification
        path: /alerts/notification
        order: 20
        perm: ALERT_VIEW

  - code: metrics
    titleZh: 指标可视化
    titleEn: Metrics
    path: /metrics
    icon: AreaChartOutlined
    order: 70
    perm: METRIC_VIEW
    children: []

  - code: ops
    titleZh: 运营大屏
    titleEn: Ops
    path: /ops
    icon: FundOutlined
    order: 80
    perm: OPS_VIEW
    children:
      - code: ops.dashboard
        titleZh: SaaS运营大屏
        titleEn: SaaS Ops
        path: /ops/dashboard
        order: 10
        perm: OPS_VIEW

  # 系统设置（统一入口：/settings/user 的 index.tsx 内置 Tab：用户/角色/个人资料）
  - code: settings
    titleZh: 系统设置
    titleEn: Settings
    path: /settings
    icon: SettingOutlined
    order: 100
    perm: SETTINGS_VIEW
    children:
      - code: settings.user
        titleZh: 用户管理
        titleEn: Users
        path: /settings/user
        order: 10
        perm: USER_VIEW
      - code: settings.tenant
        titleZh: 租户管理
        titleEn: Tenant
        path: /settings/tenant
        order: 30
        perm: TENANT_VIEW

  - code: files
    titleZh: 文件中心
    titleEn: Files
    path: /files
    icon: CloudOutlined
    order: 50
    perm: FILE_VIEW
    children: [ ]
