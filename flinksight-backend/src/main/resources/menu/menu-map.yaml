# 顶层菜单（真源）
tops:
  - code: dashboard
    titleZh: 总览大屏
    titleEn: Dashboard
    path: /dashboard
    icon: HomeOutlined
    order: 10
    perm: DASHBOARD_VIEW
    children: []

  - code: cluster
    titleZh: 集群管理
    titleEn: Clusters
    path: /cluster
    icon: DatabaseOutlined
    order: 30
    perm: CLUSTER_VIEW
    children:
      - code: cluster.list
        titleZh: 集群列表
        titleEn: Cluster List
        path: /cluster/list
        order: 10
        perm: CLUSTER_VIEW
      - code: cluster.node
        titleZh: 节点状态
        titleEn: Node Status
        path: /cluster/node
        order: 20
        perm: CLUSTER_VIEW

  - code: job
    titleZh: 作业运维
    titleEn: Jobs
    path: /job
    icon: DatabaseOutlined
    order: 35
    perm: JOB_VIEW
    children:
      - code: job.list
        titleZh: 作业列表
        titleEn: Job List
        path: /job/list
        order: 10
        perm: JOB_VIEW

  - code: alerts
    titleZh: 报警中心
    titleEn: Alerts
    path: /alerts
    icon: BellOutlined
    order: 40
    perm: ALERT_VIEW
    children:
      - code: alerts.list
        titleZh: 报警流水
        titleEn: Alerts List
        path: /alerts/list
        order: 10
        perm: ALERT_VIEW
      - code: alerts.notification
        titleZh: 通知中心
        titleEn: Notification
        path: /alerts/notification
        order: 20
        perm: ALERT_VIEW

  - code: metrics
    titleZh: 指标可视化
    titleEn: Metrics
    path: /metrics
    icon: AreaChartOutlined
    order: 70
    perm: METRICS_VIEW
    children:
      - code: metrics.dashboard
        titleZh: 指标大屏
        titleEn: Metric Dashboard
        path: /metrics/dashboard
        order: 10
        perm: METRICS_VIEW

  - code: ops
    titleZh: 运营大屏
    titleEn: Ops
    path: /ops
    icon: FundOutlined
    order: 80
    perm: OPS_VIEW
    children:
      - code: ops.dashboard
        titleZh: SaaS运营大屏
        titleEn: SaaS Ops
        path: /ops/dashboard
        order: 10
        perm: OPS_VIEW

  - code: files
    titleZh: 文件中心
    titleEn: Files
    path: /files
    icon: CloudOutlined
    order: 50
    perm: FILE_VIEW
    children: [ ]

  # 个人中心（仅当前登录用户）
  - code: profile
    titleZh: 个人中心
    titleEn: Profile
    path: /profile
    icon: UserOutlined
    order: 90
    perm: USER_VIEW
    children:
      - code: profile.center
        titleZh: 我的资料
        titleEn: My Profile
        path: /profile/center
        order: 10
        perm: USER_VIEW

  # 系统设置（集中放 RBAC / 租户）
  - code: settings
    titleZh: 系统设置
    titleEn: Settings
    path: /settings
    icon: SettingOutlined
    order: 100
    perm: SETTINGS_VIEW
    children:
      - code: settings.user
        titleZh: 用户管理
        titleEn: Users
        path: /settings/user
        order: 10
        perm: USER_VIEW
      - code: settings.role
        titleZh: 角色管理
        titleEn: Roles
        path: /settings/role
        order: 20
        perm: ROLE_VIEW
      - code: settings.tenant
        titleZh: 租户管理
        titleEn: Tenant
        path: /settings/tenant
        order: 30
        perm: TENANT_VIEW
