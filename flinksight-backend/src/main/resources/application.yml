server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flinksight_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: zxh
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

jwt:
  secret: ChangeMeToYourSecretKey-ChangeMeToYourSecretKey
  expire: 86400000 # 1 day

logging:
  level:
    root: INFO
business:
  default-user-role: USER


front:
  url: ${FRONT_URL}

sso:
  oauth2:
    authorize-url: ${SSO_OAUTH2_AUTHORIZE_URL}
    token-url: ${SSO_OAUTH2_TOKEN_URL}
    userinfo-url: ${SSO_OAUTH2_USERINFO_URL}
    client-id: ${SSO_OAUTH2_CLIENT_ID}
    client-secret: ${SSO_OAUTH2_CLIENT_SECRET}
    callback-url: ${SSO_OAUTH2_CALLBACK_URL}

cors:
  allowed-origins: "http://localhost:5173"
  allowed-methods: "GET,POST,PUT,DELETE"
  allowed-headers: "Authorization, Content-Type"
  allow-credentials: true
  max-age: 3600
# 多租户/审计可加自定义配置
