server:
  port: 8080

spring:
  # （可选）JSON / 时区等基础配置
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://localhost:3306/flinksight_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: zxh
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

jwt:
  secret: ChangeMeToYourSecretKey-ChangeMeToYourSecretKey
  expire: 86400000 # 1 day

logging:
  level:
    root: INFO
    org.springframework.security: info
    org.springframework.web: info
business:
  default-user-role: USER


front:
  url: ${FRONT_URL}

sso:
  oauth2:
    # 你的 Keycloak 实例（本地示例：http://localhost:8081）
    realm: flinksight
    issuer: http://localhost:9090/realms/flinksight
    # —— OIDC 标准端点（按 issuer 拼接，与你的 Controller/Service 属性名保持一致）
    authorize-url: ${SSO_OAUTH2_AUTHORIZE_URL}
    token-url:     ${SSO_OAUTH2_TOKEN_URL}
    end-session-url: ${SSO_OAUTH2_END_SESSION_URL}
    userinfo-url:  ${SSO_OAUTH2_USERINFO_URL}
    # —— OAuth2 客户端信息（与 Keycloak Client 一致）
    #   Public + PKCE（推荐）：client-secret 留空或移除
    #   Confidential：请在 Keycloak 上启用 Client authentication，并在此填入 secret
    client-id:     ${SSO_OAUTH2_CLIENT_ID}
    client-secret: ${SSO_OAUTH2_CLIENT_SECRET} # Public+PKCE 留空；Confidential 则填实际密钥
    # —— 回调地址（需同时在 Keycloak Client 的 Valid redirect URIs 中登记）
    callback-url:  ${SSO_OAUTH2_CALLBACK_URL}

cors:
  allowed-origins: "http://localhost:5173"
  allowed-methods: "GET,POST,PUT,DELETE"
  allowed-headers: "Authorization,Content-Type,X-Tenant-Id,X-Requested-With,Accept,Origin"
  exposed-headers: "Authorization"  # ✅ 缺失的配置项
  allow-credentials: true
  max-age: 3600


security:
  jwt:
    secret: "a_very_long_random_secret_at_least_32_bytes___________________________"
    access-ttl-ms: 86400000        # 1天
    clock-skew-seconds: 60
    issuer: "flinksight"
    audience: "api"

  permission-filter:
    enabled: true
    # 你的业务接口统一前缀
    api-prefix: "/api"
    # 是否把 menu-map.yaml 里的一级/二级菜单 path 也加入白名单
    include-menu-map: true
    # 这里只放“固定公共资源/SSO/两个人员接口”，菜单会自动合并，不需要手填
    skip:
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-resources/**"
      - "/webjars/**"
      - "/doc.html"
      - "/static/**"
      - "/favicon.ico"
      - "/assets/**"
      - "/actuator/**"
      - "/health"
      - "/public/**"
      - "/sso/**"
      - "GET /api/user/me"
      - "GET /api/user/menus"


# 多租户/审计可加自定义配置
